name: CI/CD - Painel de deploy

on:
  push:
    branches: [main]
    paths:
      - "atividade-ci-cd/**"
      - "pizza-hut/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atividade-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # O protótipo do painel de BI é publicado na subpasta /pizza-hut/ do mesmo site.
      - name: Build do protótipo Pizza Hut
        working-directory: pizza-hut
        run: |
          npm ci
          npm run build -- --base=/ads-2-semestre/pizza-hut/
      - name: Junta o protótipo ao site
        working-directory: .
        run: cp -r pizza-hut/dist atividade-ci-cd/dist/pizza-hut
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atividade-ci-cd/dist

  deploy:
    name: Deploy (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
