<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Entrega 5 - Objetos, Dados e Assincronismo</title>
  </head>
  <body>
    <h1>Entrega 5 — Objetos, Dados e Assincronismo</h1>

    <section id="secao-pedidos">
      <h2>Parte 1 — Pedidos (ver resultado no Console)</h2>
    </section>

    <section id="secao-cep">
      <h2>Parte 2 — Buscador de CEP</h2>
      <form id="formulario-cep">
        <input type="text" id="campo-cep" placeholder="Digite o CEP (somente números)" />
        <button type="submit" id="botao-cep">Buscar</button>
      </form>
      <p id="status-cep"></p>
      <dl id="resultado-cep"></dl>
      <h3>Histórico de CEPs pesquisados</h3>
      <ul id="historico-cep"></ul>
    </section>

    <section id="secao-pokemon">
      <h2>Parte 3 — Mini Pokédex</h2>
      <form id="formulario-pokemon">
        <input type="text" id="campo-pokemon" placeholder="Nome do Pokémon" />
        <button type="submit" id="botao-pokemon">Buscar</button>
      </form>
      <p id="status-pokemon"></p>
      <div id="resultado-pokemon"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
